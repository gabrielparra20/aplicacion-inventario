{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl text-center">
    <h1 class="text-2xl font-bold text-red-700 mb-4">
        ⚠️ Confirmar Eliminación ⚠️
    </h1>
    <p class="text-gray-600 mb-6">
        ¿Estás seguro de que quieres eliminar el registro de **{{ nombre_modulo }}** llamado:
        <span class="font-bold text-gray-800">"{{ nombre_item }}"</span>?
        Esta acción es irreversible.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center space-x-4">
            <button type="submit" class="bg-red-600 text-white font-semibold py-2 px-6 rounded-xl hover:bg-red-700 transition-colors duration-300 shadow-lg">
                Sí, Eliminar Permanentemente
            </button>
            <a href="{% url 'listar_material_envase' %}" class="bg-gray-400 text-white font-semibold py-2 px-6 rounded-xl hover:bg-gray-500 transition-colors duration-300 shadow-lg">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
