    {% extends 'inventario/base.html' %}
    
    {% block title %}Liberar Producto{% endblock %}
    
    {% block content %}
    <div class="bg-white rounded-lg shadow-md p-6 max-w-lg mx-auto">
        <h1 class="text-2xl font-bold mb-4">Liberar Producto</h1>
        <p class="text-gray-700 mb-6">¿Estás seguro que deseas liberar este producto?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                Confirmar Liberación
            </button>
            <a href="{% url 'productos_pendientes' %}" class="ml-4 text-gray-600 hover:text-gray-800">Cancelar</a>
        </form>
    </div>
    {% endblock %}
