{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-gray-800 text-center mb-6 border-b pb-3">
        {{ titulo }} </h1>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ field.label }}
            </label>
            
            {{ field }}
            
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const field = document.getElementById('{{ field.id_for_label }}');
                    if (field) {
                        // Aplicar clases comunes a todos los inputs, textareas y selects
                        field.classList.add('mt-1', 'block', 'w-full', 'rounded-xl', 'border-gray-300', 'shadow-sm', 'focus:border-blue-500', 'focus:ring-blue-500', 'sm:text-sm', 'p-3', 'border');
                        
                        // Ajuste específico para el select (unidad_medida)
                        if (field.tagName === 'SELECT') {
                            field.classList.add('appearance-none', 'bg-white'); // Asegura que se vea bien el select
                        }
                    }
                });
            </script>

            {% for error in field.errors %}
                <p class="mt-1 text-sm text-red-600">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}
        
        <div class="pt-4 flex justify-end space-x-3">
            <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-xl hover:bg-blue-700 transition duration-300 shadow-lg">
                Guardar
            </button>
            <a href="{% url 'dashboard' %}" class="bg-gray-400 text-white font-semibold py-2 px-6 rounded-xl hover:bg-gray-500 transition duration-300 shadow-lg">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
