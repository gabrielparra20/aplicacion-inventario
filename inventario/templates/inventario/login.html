<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Puedes reutilizar los estilos de fuente de base.html */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8 border-b pb-3">
            Iniciar Sesión
        </h1>
        
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="p-3 rounded-xl shadow-md text-sm {% if message.tags == 'success' %}bg-green-100 text-green-800 border-l-4 border-green-500{% elif message.tags == 'error' %}bg-red-100 text-red-800 border-l-4 border-red-500{% else %}bg-blue-100 text-blue-800 border-l-4 border-blue-500{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-4">
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                
                <script>
                    document.addEventListener('DOMContentLoaded', function() {
                        const field = document.getElementById('{{ field.id_for_label }}');
                        if (field) {
                            field.classList.add('mt-1', 'block', 'w-full', 'rounded-xl', 'border-gray-300', 'shadow-sm', 'focus:border-blue-500', 'focus:ring-blue-500', 'sm:text-sm', 'p-3', 'border');
                            {% if field.errors %}
                            field.classList.add('border-red-500');
                            {% endif %}
                        }
                    });
                </script>

                {% for error in field.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition duration-300 shadow-lg">
                Ingresar
            </button>
        </form>
    </div>
</body>
</html>
