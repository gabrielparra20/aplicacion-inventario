<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Confirmar Eliminación</h1>
        <p class="text-gray-600 mb-6">¿Estás seguro de que quieres eliminar la materia prima "{{ materia_prima.nombre }}"?</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <button type="submit" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-xl hover:bg-red-700 transition-colors duration-300 shadow-md">
                    Eliminar
                </button>
                <a href="{% url 'dashboard' %}" class="bg-gray-400 text-white font-semibold py-2 px-4 rounded-xl hover:bg-gray-500 transition-colors duration-300 shadow-md">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</body>
</html>
